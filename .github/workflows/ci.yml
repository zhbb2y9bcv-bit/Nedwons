# CI security gates (SECURITY.md, NIST SSDF). Enforcement intent; wire to the real repo runner.
# Covers the WHOLE Rust workspace (auth-core + api) and the standalone mls-core crate — not just
# auth-core (Gate 0 finding R-G0-3) — plus a real Postgres so the API integration tests run, and
# a Software Composition Analysis (SCA) gate that fails on any advisory not explicitly documented
# in docs/SECURITY_AUDIT_EXCEPTIONS.md (Gate 0 finding R-G0-1).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: backend (auth-core + api, Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nedwons_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost/nedwons_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check (whole workspace)
        run: cargo fmt --all -- --check
      - name: Clippy (whole workspace, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (auth-core invariants + api integration vs real Postgres)
        run: cargo test --workspace

  mls-core:
    name: mls-core (E2EE crypto integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/mls-core
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (E2EE properties)
        run: cargo test

  mls-ffi:
    name: mls-ffi (UniFFI boundary)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/mls-ffi
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (FFI object semantics + adversarial corpus)
        run: cargo test

  # mls-wasm was in NO job until 2026-09-10 and silently stopped compiling as a result: its inbound
  # match covered 7 of ~17 outcomes and nothing noticed for weeks. It has no tests of its own (the
  # logic under it is mls-core's, which is tested), so a build is the whole point — it is here to
  # fail loudly the next time the core's surface moves out from under it.
  mls-wasm:
    name: mls-wasm (web binding builds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/mls-wasm
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - name: Build (wasm target)
        run: cargo build --target wasm32-unknown-unknown

  sbom:
    name: SBOM (CycloneDX, R-501)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOMs for every workspace
        run: scripts/generate_sbom.sh
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom/*.cdx.json
          if-no-files-found: error

  sca:
    name: dependency advisories (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the secret scan covers every commit, not just HEAD
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Ignored advisories are documented per-ID with target-reachability analysis and a removal
      # trigger in docs/SECURITY_AUDIT_EXCEPTIONS.md (tracked as RISK_REGISTER R-505). Any NEW
      # advisory not on this list fails the build. All three Rust workspaces are scanned (separate
      # Cargo.lock files). Keep this list identical to the exceptions doc.
      # The seven libcrux advisories were RESOLVED by the post-quantum provider upgrade (ADR-0016):
      # the hpke-rs 0.7 stack moved the whole libcrux chain to advisory-fixed versions
      # (sha3 0.0.10, secrets 0.0.6) and dropped libcrux-aesgcm entirely. Only the compile-time
      # proc-macro-error2 advisory remains.
      - name: cargo audit (services workspace)
        working-directory: services
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0173
      - name: cargo audit (mls-core)
        working-directory: core/mls-core
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0173
      - name: cargo audit (mls-ffi)
        working-directory: core/mls-ffi
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0173
      # Run a pinned, checksum-verified gitleaks binary directly rather than the action, so the
      # scan deterministically uses the repo's vetted allowlist (.gitleaks.toml) — the full default
      # ruleset stays active and only manually-confirmed false positives are suppressed. Pinning the
      # version + verifying the SHA-256 keeps this supply-chain-safe.
      - name: Secret scan (gitleaks, pinned + checksum-verified)
        run: |
          set -euo pipefail
          GL_VER=8.30.1
          GL_SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GL_SHA}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

  swift-package:
    name: NedwonsKit (build + test)
    runs-on: macos-15   # provides Xcode 26 / Swift 6 toolchain
    steps:
      - uses: actions/checkout@v4
      - name: Build (NedwonsKit + NedwonsUI)
        working-directory: apps/ios/NedwonsKit
        run: swift build
      - name: Test (transcript/interop unit tests)
        working-directory: apps/ios/NedwonsKit
        run: swift test

  mls-bridge:
    name: mls-ffi Apple packaging + Swift MLS integration
    runs-on: macos-15   # Xcode 26 / Swift 6 + Apple SDKs
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build XCFramework + generate bindings (ADR-0007)
        run: scripts/build_mls_ffi.sh
      - name: Fail if committed Swift bindings are stale
        run: scripts/build_mls_ffi.sh --check
      - name: Swift ↔ Rust MLS integration test (host / macOS slice)
        working-directory: apps/ios/NedwonsMLS
        run: swift test
      - name: RUN bridge tests on the iOS simulator (ios-arm64-simulator slice)
        run: scripts/test_mls_sim.sh
      - name: Compile iOS device slice (compile-only — running needs hardware, R-101)
        working-directory: apps/ios/NedwonsMLS
        run: xcodebuild build -scheme NedwonsMLS -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

  ios-app:
    name: ios app target (build + test on simulator)
    runs-on: macos-15   # must provide Xcode 26 (iOS 26 SDK) per Apple's 2026-04-28 mandate
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Install Rust + Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
      # The app links MlsFfi, so the XCFramework must exist before the project is generated.
      - name: Build the MLS XCFramework (ADR-0007)
        run: scripts/build_mls_ffi.sh
      # The .xcodeproj is a build artifact generated from project.yml (gitignored, regenerable),
      # which is why this job could previously claim there was "no Xcode project" to build.
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apps/ios/Nedwons && xcodegen generate
      # Pick whatever iPhone simulator the runner actually has, rather than naming one. A hard-coded
      # device name breaks whenever the image's simulator set changes, and `generic/platform=iOS
      # Simulator` is not usable here: it also builds x86_64, while MlsFfi.xcframework ships only an
      # arm64 simulator slice.
      - name: Build the @main app target for the simulator
        working-directory: apps/ios/Nedwons
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for rt in devices for d in devices[rt] if 'iPhone' in d['name']))")
          echo "building for simulator $DEVICE_ID"
          xcodebuild build \
            -project Nedwons.xcodeproj \
            -scheme Nedwons \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
      # XCUITest: the real app, driven on the simulator through its screens, with only the network
      # replaced by the Debug-only in-process fixture. Until this step existed no CI job rendered a
      # single SwiftUI view, so every screen-level regression was invisible.
      - name: Run the XCUITest suite on the simulator (group admin flows)
        # Pin the derived-data path so the artifact step below knows where the results are.
        env:
          NEDWONS_SIM_DD: ${{ runner.temp }}/nedwons-ui-simdd
        run: scripts/test_ui_sim.sh
      # A UI test that fails only on CI is undiagnosable from the console summary alone; the
      # result bundle carries the failure messages, the view hierarchy and the screenshots.
      - name: Upload the xcresult bundle when UI tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcuitest-results
          path: ${{ runner.temp }}/nedwons-ui-simdd/Logs/Test
          if-no-files-found: warn
      # Compile-only for a real device: running needs hardware (R-101), but a device-slice
      # compile failure is a real regression and must not wait for a manual build.
      - name: Compile the device slice (compile-only — running needs hardware, R-101)
        working-directory: apps/ios/Nedwons
        run: |
          xcodebuild build \
            -project Nedwons.xcodeproj \
            -scheme Nedwons \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

  app-packages:
    name: NedwonsApp (composition layer tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + Apple targets
        # build_mls_ffi.sh builds ALL THREE slices (host, device, simulator), so the job needs
        # every target — not just the host one it links its tests against.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build the MLS XCFramework (the composition tests drive the real core)
        run: scripts/build_mls_ffi.sh
      - name: Test
        working-directory: apps/ios/NedwonsApp
        run: swift test

  migrations:
    name: migration smoke (empty + seeded database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nedwons_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost/nedwons_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # Migrations that only ever run against an already-migrated database are untested. These
      # tests build a genuinely EMPTY database, run the whole chain into it, and assert the
      # integrity objects (foreign keys, triggers, unique indexes) actually arrive — then
      # re-migrate the seeded database to prove idempotence and the absence of orphans.
      - name: Schema integrity + migration smoke
        working-directory: services
        run: cargo test -p nedwons-api --test schema_integrity

  license-policy:
    name: licence + source policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      # Licences and dependency SOURCES, which `cargo audit` says nothing about: an allow-list so a
      # dependency arriving under an unlisted licence fails closed, and crates.io-only so a git
      # dependency or path override cannot slip into a lockfile unnoticed.
      - name: services workspace
        working-directory: services
        run: cargo deny --config ../deny.toml check licenses sources bans
      - name: mls-core
        working-directory: core/mls-core
        run: cargo deny --config ../../deny.toml check licenses sources bans
      - name: mls-ffi
        working-directory: core/mls-ffi
        run: cargo deny --config ../../deny.toml check licenses sources bans

  fuzz-smoke:
    name: fuzz targets (bounded smoke run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust (cargo-fuzz requires it)
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # A short, bounded run on every push. This is a REGRESSION check, not a fuzzing campaign:
      # it re-runs the committed corpus and a brief exploration so a change that reintroduces a
      # previously found crash (e.g. the `now_ms` overflow panic in secret_state) fails here
      # rather than in a long-running job nobody watches.
      - name: content_decode
        working-directory: core/mls-ffi
        run: cargo fuzz run content_decode -- -max_total_time=60 -timeout=10
      - name: envelope
        working-directory: core/mls-ffi
        run: cargo fuzz run envelope -- -max_total_time=60 -timeout=10
      - name: secret_state
        working-directory: core/mls-ffi
        run: cargo fuzz run secret_state -- -max_total_time=60 -timeout=10

  container-scan:
    name: container + IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        # Context is the REPOSITORY ROOT: the services workspace references core/mls-core and the
        # vendored openmls_rust_crypto patch, neither of which a services-only context can see.
        run: docker build -f services/api/Dockerfile -t nedwons-api:ci .
      # The image ships a Debian base and a static binary; a base-image CVE is invisible to
      # cargo audit, which only sees Rust crates.
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: nedwons-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Scan infrastructure definitions
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: config
          scan-ref: infra
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

  release-gate:
    name: release readiness (placeholder check blocking, risks reported)
    runs-on: ubuntu-latest
    needs:
      - backend
      - mls-core
      - mls-ffi
      - sca
      - sbom
      - swift-package
      - mls-bridge
      - ios-app
      - app-packages
      - migrations
      - license-policy
    steps:
      - uses: actions/checkout@v4
      # On a pull request this enforces only "no fake jobs" and REPORTS open critical risks.
      # Blocking pull requests on R-503 (external audits that have not happened yet) would turn
      # every run red forever and teach everyone to ignore CI. The release workflow
      # (.github/workflows/release.yml) runs the same gate in blocking mode.
      # The gate is security infrastructure too: if its parser silently stops matching, it
      # reports success forever. Its self-test runs first.
      - name: Gate self-test
        run: python3 scripts/release_gate.py --self-test
      - name: Release readiness
        run: python3 scripts/release_gate.py --placeholders-only --explain
