# Standalone crate (its own workspace) — the shared MLS protocol integration layer
# (ADR-0001). It exposes a narrow, memory-safe API that the iOS client reaches over a UniFFI
# boundary. The backend does NOT depend on this crate: the server only ever handles opaque
# ciphertext, so it must not link the protocol library (defense in depth / smaller TCB).
[package]
name = "mls-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[workspace]

[dependencies]
# Mature, maintained, independently reviewed MLS (RFC 9420) — no custom crypto (ADR-0001).
openmls = "0.8"
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"
openmls_traits = "0.5"
thiserror = "1"
# Durable client state (crash-safe state machine): serialize the coupled MLS-store snapshot +
# message/queue metadata as one atomically-committed blob.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# At-rest encryption for the local store (FileJournal). Vetted RustCrypto AES-256-GCM — no custom
# crypto; same crate family OpenMLS's provider already uses. The key comes from the caller (on
# device: the Keychain-wrapped local key hierarchy, CRYPTOGRAPHY.md §5).
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

# WASM spike: on wasm32 there is no OS randomness syscall, so `getrandom` must be pointed at the
# browser's `crypto.getRandomValues` explicitly or it `compile_error!`s. Two majors are in the graph
# and each has its own opt-in, so both are named here purely to turn the feature on (feature
# unification); no code in this crate calls them directly.
#   0.2 (via rand_core 0.6 → OsRng, used by durable.rs)  -> "js"
#   0.4 (via rand 0.10 → hpke-rs, libcrux-sha3, uuid)    -> "wasm_js"
# Target-gated so the native/iOS build graph is completely unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
# OpenMLS hard-errors on wasm32 unless told JS APIs exist. The feature swaps `std::time::SystemTime`
# (which panics on wasm32-unknown-unknown) for a `Date.now()`-backed clock, used to stamp and check
# KeyPackage lifetimes. SECURITY NOTE: this puts KeyPackage lifetime validation on the browser's wall
# clock, which the user can set freely — unlike iOS. Lifetime enforcement is therefore advisory on
# web; the server-side prekey TTL (KEY_PACKAGE_TTL_SECS) remains the authority.
openmls = { version = "0.8", features = ["js"] }

# PQ: substitute the vendored provider (core/vendor/openmls_rust_crypto) for the crates.io one.
# Same crate, version 0.5.1, with two documented changes (see its README): the X-Wing hybrid
# post-quantum KEM arm is implemented (upstream left it unimplemented!()) and the hpke-rs stack is
# lifted to 0.7 (whose rust-crypto backend provides X-Wing via RustCrypto's pure-Rust ml-kem).
[patch.crates-io]
openmls_rust_crypto = { path = "../vendor/openmls_rust_crypto" }
