# Standalone crate (its own workspace) — the shared MLS protocol integration layer
# (ADR-0001). It exposes a narrow, memory-safe API that the iOS client reaches over a UniFFI
# boundary. The backend does NOT depend on this crate: the server only ever handles opaque
# ciphertext, so it must not link the protocol library (defense in depth / smaller TCB).
[package]
name = "mls-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[workspace]

[dependencies]
# Mature, maintained, independently reviewed MLS (RFC 9420) — no custom crypto (ADR-0001).
openmls = "0.8"
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"
openmls_traits = "0.5"
thiserror = "1"
# Durable client state (crash-safe state machine): serialize the coupled MLS-store snapshot +
# message/queue metadata as one atomically-committed blob.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# At-rest encryption for the local store (FileJournal). Vetted RustCrypto AES-256-GCM — no custom
# crypto; same crate family OpenMLS's provider already uses. The key comes from the caller (on
# device: the Keychain-wrapped local key hierarchy, CRYPTOGRAPHY.md §5).
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

# NOTE: this crate deliberately carries NO wasm32 feature opt-ins, even though it is the crate that
# compiles to WebAssembly. Cargo resolves `Cargo.lock` TARGET-AGNOSTICALLY, so declaring them here
# wrote browser-only crates (fluvio-wasm-timer, instant, …) into `mls-ffi`'s and `services`'
# lockfiles too — polluting the SERVER's `cargo audit` output and SBOM with dependencies the server
# can never execute. They live in `core/mls-wasm` instead (ADR-0017), which is the only crate built
# for wasm32; feature unification applies them to this crate within that build graph.
# Consequence: `cargo build --target wasm32-*` FROM THIS DIRECTORY fails by design. Build
# `core/mls-wasm` instead.

# PQ: substitute the vendored provider (core/vendor/openmls_rust_crypto) for the crates.io one.
# Same crate, version 0.5.1, with two documented changes (see its README): the X-Wing hybrid
# post-quantum KEM arm is implemented (upstream left it unimplemented!()) and the hpke-rs stack is
# lifted to 0.7 (whose rust-crypto backend provides X-Wing via RustCrypto's pure-Rust ml-kem).
[patch.crates-io]
openmls_rust_crypto = { path = "../vendor/openmls_rust_crypto" }
