# XcodeGen spec for the NEDWONS app (a runnable @main iOS target that boots the real product shell).
# Generate the project with `xcodegen generate` (in this directory), then build/run.
# The app links the local SwiftPM packages by relative path, so no versions are pinned here.
# Regenerate whenever this file changes; the generated .xcodeproj is a build artifact (gitignored).
name: Nedwons
options:
  bundleIdPrefix: app.nedwons
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NedwonsKit:
    path: ../NedwonsKit
  NedwonsMLS:
    path: ../NedwonsMLS
  NedwonsApp:
    path: ../NedwonsApp

targets:
  Nedwons:
    type: application
    platform: iOS
    sources:
      - Sources
      # Apple requires PrivacyInfo.xcprivacy at the APP BUNDLE ROOT. It lives outside `Sources/`,
      # so without this it stays in the repo and never ships — which is how a manifest can look
      # maintained while being invisible to App Store review (verified: it was absent from the
      # built .app before this line existed).
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: NedwonsKit
        product: NedwonsUI
      - package: NedwonsMLS
        product: MlsFfi
      - package: NedwonsApp
        product: NedwonsAppKit
      # Embed the Notification Service Extension (#4) so a contentless push can decrypt + rewrite.
      - target: NotificationService
        embed: true
    # A real Info.plist (not the auto-generated one) so the app can carry custom build config:
    #   NedwonsServerURL          — backend base URL for this build (https on device; empty ⇒ dev)
    #   NedwonsTransparencyLogKey — the out-of-band-pinned KT log public key (hex; empty ⇒ dev TOFU)
    # Set these per build configuration (or via CI) before a device build; AppConfig reads them.
    info:
      path: Nedwons/Info.plist
      properties:
        CFBundleDisplayName: Nedwons
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Wake the app to fetch its inbox on a contentless push (#4).
        UIBackgroundModes:
          - remote-notification
        # Pairing to link a device scans a QR code (#8 device linking).
        NSCameraUsageDescription: "Scan QR codes to join groups by invite, verify a contact's safety number, or link another of your devices."
        NSMicrophoneUsageDescription: "Record voice messages. Audio is end-to-end encrypted before it leaves your device."
        NedwonsServerURL: ""
        NedwonsTransparencyLogKey: ""
        # The provisioned app group (e.g. group.app.nedwons.demo). Empty ⇒ app-private stores and
        # generic push wakes. Set it TOGETHER with the com.apple.security.application-groups
        # entitlement on BOTH targets; AppComposition then roots MLS stores in the shared
        # container and the notification extension can decrypt (NOTIFICATION_EXTENSION.md).
        NedwonsAppGroup: ""
        # Export compliance. Declared TRUE deliberately: this app's core function is end-to-end
        # encrypted messaging, so claiming one of the exemptions would be a claim we cannot
        # substantiate — and it is made to a regulator, not to Apple. Declaring true means export
        # documentation (self-classification / ERN, possibly CCATS) must be filed BEFORE
        # submission. That is a legal determination, not an engineering one: see
        # docs/APP_STORE_PRIVACY.md and get counsel before shipping.
        ITSAppUsesNonExemptEncryption: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nedwons.demo
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Capabilities are declared in the entitlements file; the App ID + provisioning profile that
        # authorize them are configured in the Apple Developer portal (your side).
        CODE_SIGN_ENTITLEMENTS: Nedwons.entitlements

  # The macOS companion app: the SAME @main, composition, screens, and Rust core (the xcframework
  # carries a macos-arm64 slice), sandboxed with least privilege. It is a second DEVICE of your
  # account (ADR-0008 enrollment + the V27 setup queue admit it to conversations) — platform-only
  # features stay iOS's: no notification extension, no App Attest, no QR scanning (paste works).
  Nedwons-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: NedwonsKit
        product: NedwonsUI
      - package: NedwonsMLS
        product: MlsFfi
      - package: NedwonsApp
        product: NedwonsAppKit
    info:
      path: Nedwons-macOS/Info.plist
      properties:
        CFBundleDisplayName: Nedwons
        NSMicrophoneUsageDescription: "Record voice messages. Audio is end-to-end encrypted before it leaves your device."
        NedwonsServerURL: ""
        NedwonsTransparencyLogKey: ""
        NedwonsAppGroup: ""
        ITSAppUsesNonExemptEncryption: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nedwons.demo.mac
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Nedwons-macOS.entitlements

  # XCUITest suite: drives the REAL app (real @main, AppModel, NedwonsClient, SwiftUI screens) on a
  # simulator, with only the network replaced by the Debug-only in-process fixture
  # (NedwonsUI/UITestHarness.swift, selected by launch argument). Before this target existed there
  # was no test in the repo that instantiated a single SwiftUI view — every screen-level regression
  # was invisible to CI. Run with scripts/test_ui_sim.sh.
  NedwonsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Nedwons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nedwons.demo.UITests
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Nedwons

  # Notification Service Extension (#4): decrypts a contentless wake push on device and rewrites the
  # alert. Links the real MLS core; the decode logic (PushInboxDecoder) is unit-tested in NedwonsApp.
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
    # Links only extension-SAFE modules: NedwonsPush (push decode) → NedwonsKit (HTTP) + MlsFfi
    # (MLS core). It must NOT link NedwonsUI (SwiftUI App types are forbidden in app extensions).
    dependencies:
      - package: NedwonsApp
        product: NedwonsPush
      - package: NedwonsKit
        product: NedwonsKit
      - package: NedwonsMLS
        product: MlsFfi
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Nedwons Notifications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        # Mirror the app's build config (an extension cannot link NedwonsUI/AppConfig): keep these
        # equal to the app target's values.
        NedwonsServerURL: ""
        NedwonsAppGroup: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nedwons.demo.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

# An explicit scheme so `xcodebuild test -scheme Nedwons` runs the XCUITest bundle against the app
# (xcodegen's auto-generated per-target schemes do not attach UI-test bundles to the app scheme).
schemes:
  Nedwons:
    build:
      targets:
        Nedwons: all
        NedwonsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NedwonsUITests
